<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1116">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dashboard">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
  <title>Dashboard</title>
</head>
<body>
  <header>
    <div>
      <h1 id="greeting">Hello</h1>
      <p id="today" class="muted"></p>
    </div>
    <button id="refresh" class="icon-btn" aria-label="Refresh">↻</button>
  </header>

  <main>
    <section id="page-home" class="page">
      <article class="card" id="weather"><h2>Weather</h2><div class="body muted">Loading…</div></article>
      <article class="card" id="trains"><h2>Trains</h2><div class="body muted">Loading…</div></article>
      <article class="card" id="camera"><h2>Camera</h2><div class="body muted">Loading…</div></article>
    </section>

    <section id="page-devices" class="page" hidden>
      <article class="card" id="tuya"><h2>Smart devices</h2><div class="body muted">Loading…</div></article>
    </section>

    <section id="page-settings" class="page" hidden>
      <article class="card" id="settings">
        <h2>Settings</h2>
        <div class="body">
          <p id="mode" class="muted"></p>
          <label class="small muted" for="token">Access token (stored only on this phone)</label>
          <input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
          <button id="save-token" class="btn">Save</button>
        </div>
      </article>

      <article class="card" id="places">
        <h2>Your places</h2>
        <div class="body">
          <label class="small muted" for="town">Fallback town (used if your location isn't available)</label>
          <input id="town" type="text" placeholder="e.g. Leeds" autocomplete="off">

          <label class="small muted" for="stationA">Station A (3-letter code)</label>
          <input id="stationA" type="text" maxlength="3" placeholder="e.g. LDS" autocapitalize="characters" autocomplete="off">

          <label class="small muted" for="stationB">Station B (3-letter code)</label>
          <input id="stationB" type="text" maxlength="3" placeholder="e.g. KGX" autocapitalize="characters" autocomplete="off">

          <label class="small muted" for="switchHour">Switch hour (0 to 23, London time)</label>
          <input id="switchHour" type="number" min="0" max="23" inputmode="numeric" placeholder="12">

          <label class="small muted" for="operator">Train operator code (optional)</label>
          <input id="operator" type="text" maxlength="2" placeholder="e.g. VT" autocapitalize="characters" autocomplete="off">

          <p class="small muted">Before the switch hour the trains card shows A to B; from then on, B to A. Everything here is saved only on this phone.</p>
          <button id="save-places" class="btn" style="margin-top:12px">Save</button>
        </div>
      </article>
    </section>
  </main>

  <div id="toast" hidden></div>

  <nav>
    <button data-tab="home" class="active"><span>🏠</span>Home</button>
    <button data-tab="devices"><span>💡</span>Devices</button>
    <button data-tab="settings"><span>⚙️</span>Settings</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
